# Non-secret configuration, mirroring compose.yml's `environment:` values.
# Split from 00-secret.example.yaml so this file can be applied/diffed
# freely (no real credentials in it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulpit-config
data:
  PULP_UPSTREAM: "pulp:80"
  PULPIT_CORE_PULP_BASE_URL: "http://pulp:80"
  PULPIT_CORE_PULP_SERVICE_USERNAME: "admin"

  # __PULPIT_PUBLIC_ORIGIN__ is substituted by ./deploy.sh at apply time from
  # the PULPIT_PUBLIC_ORIGIN env var - edit directly if applying without
  # deploy.sh. Must match wherever pulpit.yaml exposes the app publicly.
  PULP_CSRF_TRUSTED_ORIGINS: '["__PULPIT_PUBLIC_ORIGIN__"]'
  PULP_CONTENT_ORIGIN: "__PULPIT_PUBLIC_ORIGIN__"
  PULP_ANSIBLE_API_HOSTNAME: "__PULPIT_PUBLIC_ORIGIN__"
  PULP_PYPI_API_HOSTNAME: "__PULPIT_PUBLIC_ORIGIN__"

  PULP_CACHE_ENABLED: "true"
  PULP_REDIS_HOST: "redis"
  PULP_REDIS_PORT: "6379"
  # See docs/DEPLOYMENT.md "Container registry authentication". Do not
  # carry this into a production deployment.
  PULP_TOKEN_AUTH_DISABLED: "true"
