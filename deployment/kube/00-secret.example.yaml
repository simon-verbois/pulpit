# Copy this file to 00-secret.yaml (gitignored, see .gitignore) and replace
# every REPLACE_ME value below before applying - same idea as .env.example
# for the Compose deployment. NEVER commit the real file.
apiVersion: v1
kind: Secret
metadata:
  name: pulpit-secrets
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  PULP_SECRET_KEY: "REPLACE_ME"

  # Sets Pulp's "admin" user password on every pod start (pulp.yaml's
  # postStart hook) - also the credential pulpit uses to call Pulp's own
  # API on its own behalf (PULPIT_CORE_PULP_SERVICE_PASSWORD in pulpit.yaml
  # references this same key). Required for the signing module to reach
  # Pulp at all.
  PULP_ADMIN_PASSWORD: "REPLACE_ME"

  # Optional - encrypts secrets pulpit-core itself stores at rest (Default
  # Settings' proxy password). Leave as-is (empty) to skip; only setting a
  # proxy password fails with a clear error until this is a real Fernet key,
  # generated with:
  #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  PULPIT_CORE_SECRET_KEY: ""

  # Optional - pulpit-core's own database is embedded SQLite by default
  # (docs/adr/0007-merged-pulpit-container.md), needing no secret at all.
  # Set this only to point it at a real Postgres instead (a full connection
  # string, password included - Kubernetes manifests have no equivalent of
  # Compose's `${VAR:?err}` interpolation to assemble one from separate
  # fields) - see pulpit.yaml's own `env` for how this would be wired in.
  # PULPIT_CORE_DATABASE_URL: "postgresql+psycopg://user:REPLACE_ME@host:5432/dbname"
