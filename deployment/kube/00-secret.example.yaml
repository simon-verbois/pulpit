# Copy to 00-secret.yaml (gitignored) and replace every REPLACE_ME value
# before applying. NEVER commit the real file.
apiVersion: v1
kind: Secret
metadata:
  name: pulpit-secrets
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  PULP_SECRET_KEY: "REPLACE_ME"

  # Also the credential pulpit uses to call Pulp's own API on its own behalf.
  PULP_ADMIN_PASSWORD: "REPLACE_ME"

  # Optional - encrypts secrets pulpit-core stores at rest. Generate with:
  #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  PULPIT_CORE_SECRET_KEY: ""

  # Optional - only needed to point pulpit-core at Postgres instead of its
  # default embedded SQLite.
  # PULPIT_CORE_DATABASE_URL: "postgresql+psycopg://user:REPLACE_ME@host:5432/dbname"
