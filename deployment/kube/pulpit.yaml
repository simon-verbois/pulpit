# Mirrors compose.yml's `pulpit` service. The only workload reachable from
# outside the cluster (Service/Ingress below); Pulp (pulp.yaml) is
# internal-only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# TLS certificate/key material for the 8443 listener - own PVC (not folded
# into pulpit-data): different sensitivity/lifecycle than the SQLite
# database, same reasoning as the dedicated signing PVCs elsewhere.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-tls
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulpit
  labels:
    app: pulpit
spec:
  replicas: 1
  # Required: pulpit-data is a ReadWriteOnce PVC, can't attach to two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulpit
  template:
    metadata:
      labels:
        app: pulpit
    spec:
      # Waits for `pulp` to answer before starting the main container -
      # mirrors compose.yml's `depends_on: pulp: condition: service_healthy`.
      initContainers:
        - name: wait-for-pulp
          image: docker.io/pulp/pulp:stable
          command:
            - sh
            - -c
            - |
              until curl -sf http://pulp:80/pulp/api/v3/status/ >/dev/null 2>&1; do
                echo "waiting for pulp..."
                sleep 5
              done
      containers:
        - name: pulpit
          image: docker.io/simonverbois/pulpit:latest
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: pulpit-config
          env:
            - name: PULPIT_CORE_PULP_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulpit-secrets
                  key: PULP_ADMIN_PASSWORD
            - name: PULPIT_CORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulpit-secrets
                  key: PULPIT_CORE_SECRET_KEY
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: pulpit-data
              mountPath: /var/lib/pulpit
            - name: pulpit-signing-gnupghome
              mountPath: /var/lib/pulpit-signing/gnupg
            - name: pulpit-signing-scripts
              mountPath: /var/lib/pulpit-signing/scripts
            - name: pulpit-tls
              mountPath: /var/lib/pulpit-tls
          readinessProbe:
            httpGet:
              path: /pulpit-core/api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /pulpit-core/api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: pulpit-data
          persistentVolumeClaim:
            claimName: pulpit-data
        - name: pulpit-signing-gnupghome
          persistentVolumeClaim:
            claimName: pulpit-signing-gnupghome
        - name: pulpit-signing-scripts
          persistentVolumeClaim:
            claimName: pulpit-signing-scripts
        - name: pulpit-tls
          persistentVolumeClaim:
            claimName: pulpit-tls
---
apiVersion: v1
kind: Service
metadata:
  name: pulpit
spec:
  selector:
    app: pulpit
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
---
# Optional - needs an Ingress controller installed and `host` below set to
# your real hostname (must also match PULP_CSRF_TRUSTED_ORIGINS in
# 00-configmap.yaml). Skip and use `kubectl port-forward svc/pulpit 8080:8080`
# for a quick local try instead.
#
# Routes to the Service's plain-HTTP 8080 port by default - the standard
# pattern of terminating TLS at the Ingress/load balancer in front of
# Pulpit, not at Pulpit itself. The Service above also exposes 8443 (Pulpit's
# own self-signed or manually imported certificate - Administration > TLS) if
# you'd rather have this Ingress terminate TLS end-to-end at Pulpit instead:
# point `backend.service.port.number` below at 8443 and add your ingress
# controller's own "backend speaks HTTPS" annotation (e.g. ingress-nginx's
# `nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulpit
spec:
  rules:
    - host: pulpit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulpit
                port:
                  number: 8080
