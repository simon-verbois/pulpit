# nginx (static SPA + reverse proxy, ADR 0005) + pulpit-core (API,
# ADR 0006) + pulpit-worker (job queue/signing automation,
# docs/signing.md) merged into one container/image
# (docs/adr/0007-merged-pulpit-container.md) - mirrors compose.yml's
# `pulpit` service. The only workload reachable from outside the cluster
# (Service/Ingress below); Pulp (pulp.yaml) is internal-only, same trust
# boundary as under Compose. Its own database is embedded SQLite (the
# `pulpit-data` PVC below), not a separate Postgres Deployment -
# app/core/config/settings.py. No ServiceAccount/RBAC needed here anymore
# (docs/adr/0008-colocated-signing-reconciler.md): signing-service
# registration is reconciled from *inside* pulp.yaml's own image now, so
# this Deployment never needs to reach the Kubernetes API at all.
# pulpit-core's own embedded SQLite database - ReadWriteOnce is enough,
# unlike pulp.yaml's signing PVCs below (only ever mounted by this one Pod).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulpit
  labels:
    app: pulpit
spec:
  replicas: 1
  # A single ReadWriteOnce PVC (pulpit-data above) can't be attached to two
  # pods at once - a rolling update would deadlock waiting for the new
  # pod's volume while the old one still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulpit
  template:
    metadata:
      labels:
        app: pulpit
    spec:
      # Waits for `pulp` to actually answer before starting the main
      # container - mirrors compose.yml's `depends_on: pulp: condition:
      # service_healthy` and deployment/podman/pulpit.yaml's own
      # `wait-for-pulp` initContainer (VERIFIED live there that
      # `initContainers` run and block correctly). Not strictly required
      # (the worker loop's own scheduled jobs simply fail-and-retry on
      # their next poll if Pulp isn't up yet - app/core/jobs), but avoids a
      # burst of confusing "Connection refused" log lines on every fresh
      # deploy.
      initContainers:
        - name: wait-for-pulp
          image: docker.io/pulp/pulp:stable
          command:
            - sh
            - -c
            - |
              until curl -sf http://pulp:80/pulp/api/v3/status/ >/dev/null 2>&1; do
                echo "waiting for pulp..."
                sleep 5
              done
      containers:
        - name: pulpit
          # __PULPIT_IMAGE_TAG__ is substituted by ./deploy.sh at apply time
          # from the PULPIT_IMAGE_TAG env var (defaulting to "latest" - same
          # name/default Compose's .env.example uses) - edit this directly
          # to a real tag instead if you apply this file without deploy.sh.
          image: docker.io/simonverbois/pulpit:__PULPIT_IMAGE_TAG__
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: pulpit-config
          env:
            - name: PULPIT_CORE_PULP_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulpit-secrets
                  key: PULP_ADMIN_PASSWORD
            - name: PULPIT_CORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulpit-secrets
                  key: PULPIT_CORE_SECRET_KEY
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: pulpit-data
              mountPath: /var/lib/pulpit
            - name: pulpit-signing-gnupghome
              mountPath: /var/lib/pulpit-signing/gnupg
            - name: pulpit-signing-scripts
              mountPath: /var/lib/pulpit-signing/scripts
          # Through nginx, not pulpit-core's own port directly - VERIFIED
          # this exercises the whole proxy chain (nginx -> pulpit-core),
          # not just one of the two.
          readinessProbe:
            httpGet:
              path: /pulpit-core/api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /pulpit-core/api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: pulpit-data
          persistentVolumeClaim:
            claimName: pulpit-data
        - name: pulpit-signing-gnupghome
          persistentVolumeClaim:
            claimName: pulpit-signing-gnupghome
        - name: pulpit-signing-scripts
          persistentVolumeClaim:
            claimName: pulpit-signing-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: pulpit
spec:
  selector:
    app: pulpit
  ports:
    - port: 8080
      targetPort: 8080
---
# Optional - needs an Ingress controller already installed in the cluster
# (nginx-ingress, traefik, etc.) and `host` below changed to your real
# hostname (must also match PULP_CSRF_TRUSTED_ORIGINS in 00-configmap.yaml -
# get this wrong and logins work but every subsequent action 403s, same
# CSRF requirement as under Compose - docs/DEPLOYMENT.md). Skip this file
# entirely and use `kubectl port-forward svc/pulpit 8080:8080` instead for a
# quick local try without any Ingress controller at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulpit
spec:
  rules:
    - host: pulpit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulpit
                port:
                  number: 8080
