[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-rpm-signing-policy"
version = "1.0.0"
description = "Require signed RPM content before publication and delivery"
requires-python = ">=3.12"

[project.entry-points."pulpcore.plugin"]
pulp_rpm_signing_policy = "pulp_rpm_signing_policy:default_app_config"

[tool.setuptools.packages.find]
include = ["pulp_rpm_signing_policy*"]
