[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulpit-egress"
version = "1.0.0"
description = "Shared global outbound HTTP proxy and TLS policy"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pulpit_egress*"]

[project.scripts]
pulpit-egress-trust = "pulpit_egress.trust:main"
curl = "pulpit_egress.tools:curl"
git = "pulpit_egress.tools:git"
