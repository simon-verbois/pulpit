[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulpit-api-compat"
version = "1.0.0"
description = "Native Pulp API compatibility fixes for task groups and registry guards"
requires-python = ">=3.12"

[project.entry-points."pulpcore.plugin"]
pulpit_api_compat = "pulpit_api_compat:default_app_config"

[tool.setuptools.packages.find]
include = ["pulpit_api_compat*"]
