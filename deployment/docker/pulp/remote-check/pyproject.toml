[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-remote-check"
version = "1.0.0"
description = "Pulpit connectivity test for saved RPM/ULN remotes"
requires-python = ">=3.11"

[project.entry-points."pulpcore.plugin"]
pulp_remote_check = "pulp_remote_check:default_app_config"

[tool.setuptools.packages.find]
include = ["pulp_remote_check*"]
