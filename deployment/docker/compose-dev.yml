# Local development stack (docs/DEVELOPMENT.md "Mode B"): identical to
# compose.yml except `pulpit` builds from local source. Run from the repo
# root with:
#
#   docker compose -f deployment/docker/compose-dev.yml --env-file .env up -d --build
#
# (or `make compose-up`).

name: pulpit

services:
  redis:
    image: docker.io/library/redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pulp:
    build:
      context: ./pulp
    environment:
      TZ: ${TZ:-UTC}
      PULPIT_EGRESS_REQUIRED: "true"
      PULP_SECRET_KEY: ${PULP_SECRET_KEY:?PULP_SECRET_KEY is required. Copy .env.example to .env and set it (openssl rand -hex 32) - see docs/DEPLOYMENT.md.}
      PULP_ADMIN_PASSWORD: ${PULP_ADMIN_PASSWORD:-}
      PULP_CSRF_TRUSTED_ORIGINS: '["${PULPIT_PUBLIC_ORIGIN:-http://localhost:8080}"]'
      PULP_CONTENT_ORIGIN: ${PULPIT_PUBLIC_ORIGIN:-http://localhost:8080}
      PULP_ANSIBLE_API_HOSTNAME: ${PULPIT_PUBLIC_ORIGIN:-http://localhost:8080}
      PULP_PYPI_API_HOSTNAME: ${PULPIT_PUBLIC_ORIGIN:-http://localhost:8080}
      PULP_CACHE_ENABLED: "true"
      PULP_REDIS_HOST: redis
      PULP_REDIS_PORT: "6379"
      # See docs/DEPLOYMENT.md "Container registry authentication". Do not
      # carry this into a production deployment.
      PULP_TOKEN_AUTH_DISABLED: "true"
      # 8h session lifetime (Django default: 2 weeks) - see docs/DEPLOYMENT.md "Sessions".
      PULP_SESSION_COOKIE_AGE: "28800"
    ports:
      - "127.0.0.1:${PULP_HTTP_PORT:-8180}:80"
    volumes:
      - pulpit_egress:/var/lib/pulpit-egress:ro
      - pulp_etc:/etc/pulp
      - pulp_var_lib_pulp:/var/lib/pulp
      - pulp_var_lib_pgsql:/var/lib/pgsql
      - pulp_var_lib_containers:/var/lib/containers
      - ./pulp/init-admin-password.sh:/usr/local/bin/pulpit-init-admin-password.sh:ro
      - pulpit_signing_gnupghome:/var/lib/pulpit-signing/gnupg
      - pulpit_signing_scripts:/var/lib/pulpit-signing/scripts:ro
    post_start:
      - command: ["/bin/sh", "/usr/local/bin/pulpit-init-admin-password.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/pulp/api/v3/status/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  pulpit:
    build:
      # Repo root, not this file's own directory - the Dockerfile needs
      # pulpit-core/ and the frontend sources too.
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        VITE_DEV_BANNER: "true"
        TZ: ${TZ:-UTC}
    environment:
      TZ: ${TZ:-UTC}
      PULP_UPSTREAM: pulp:80
      PULPIT_CORE_PULP_BASE_URL: http://pulp:80
      PULPIT_CORE_PULP_SERVICE_USERNAME: admin
      PULPIT_CORE_PULP_SERVICE_PASSWORD: ${PULP_ADMIN_PASSWORD:-}
      PULPIT_CORE_SECRET_KEY: ${PULPIT_CORE_SECRET_KEY:-}
      PULPIT_CORE_FIXTURE_SEED_ENABLED: ${PULPIT_CORE_FIXTURE_SEED_ENABLED:-false}
    volumes:
      - pulpit_egress:/var/lib/pulpit-egress
      - pulpit_data:/var/lib/pulpit
      - pulpit_signing_gnupghome:/var/lib/pulpit-signing/gnupg
      - pulpit_signing_scripts:/var/lib/pulpit-signing/scripts
      - pulpit_tls:/var/lib/pulpit-tls
    ports:
      - "${PULPIT_HTTP_PORT:-8080}:8080"
      - "${PULPIT_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pulpit-core/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      pulp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pulpit_egress:
  pulp_etc:
  pulp_var_lib_pulp:
  pulp_var_lib_pgsql:
  pulp_var_lib_containers:
  pulpit_data:
  pulpit_signing_gnupghome:
  pulpit_signing_scripts:
  # TLS certificate/key material for the 8443 listener - its own volume
  # (not folded into pulpit_data): different sensitivity/lifecycle than the
  # SQLite database, same reasoning as the dedicated signing volumes above.
  pulpit_tls:
