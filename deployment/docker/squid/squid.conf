http_port 3128
visible_hostname pulpit-dev-squid

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain -n "/etc/squid/allowed-domains.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager
http_access allow allowed_domains
http_access deny all

# Preserve Oracle's TLS end to end. CONNECT filtering sees domains, not
# encrypted URL paths; adding HTTPS inspection would change this test.
cache deny all
# The Ubuntu image tails these files to the container's stdout.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none
pid_filename /run/squid.pid
shutdown_lifetime 1 seconds
