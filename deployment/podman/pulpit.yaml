# Mirrors compose.yml's `pulpit` service. The only pod reachable from
# outside this host (hostPort below); `pulp`/`redis` are reachable by pod
# name on the internal Podman network only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# TLS certificate/key material for the 8443 listener - own PVC (not folded
# into pulpit-data): different sensitivity/lifecycle than the SQLite
# database, same reasoning as the dedicated signing PVCs below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-tls
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pulpit
  labels:
    app: pulpit
spec:
  # Waits for `pulp` to answer before starting the main container -
  # mirrors compose.yml's `depends_on: pulp: condition: service_healthy`.
  initContainers:
    - name: wait-for-pulp
      image: docker.io/pulp/pulp:stable
      command:
        - sh
        - -c
        - |
          until curl -sf http://pulp:80/pulp/api/v3/status/ >/dev/null 2>&1; do
            echo "waiting for pulp..."
            sleep 5
          done
  containers:
    - name: pulpit
      image: docker.io/simonverbois/pulpit:latest
      envFrom:
        - configMapRef:
            name: pulpit-config
      env:
        - name: PULPIT_CORE_PULP_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pulpit-secrets
              key: PULP_ADMIN_PASSWORD
        - name: PULPIT_CORE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pulpit-secrets
              key: PULPIT_CORE_SECRET_KEY
      ports:
        - containerPort: 8080
          hostPort: 8080
        - containerPort: 8443
          hostPort: 8443
      volumeMounts:
        - name: pulpit-data
          mountPath: /var/lib/pulpit
        - name: pulpit-signing-gnupghome
          mountPath: /var/lib/pulpit-signing/gnupg
        - name: pulpit-signing-scripts
          mountPath: /var/lib/pulpit-signing/scripts
        - name: pulpit-tls
          mountPath: /var/lib/pulpit-tls
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
      readinessProbe:
        httpGet:
          path: /pulpit-core/api/v1/health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5
      livenessProbe:
        httpGet:
          path: /pulpit-core/api/v1/health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5
  volumes:
    - name: pulpit-data
      persistentVolumeClaim:
        claimName: pulpit-data
    # Declared in pulp.yaml, shared between the two pods. Apply pulp.yaml
    # first (./deploy.sh does) so these already exist.
    - name: pulpit-signing-gnupghome
      persistentVolumeClaim:
        claimName: pulpit-signing-gnupghome
    - name: pulpit-signing-scripts
      persistentVolumeClaim:
        claimName: pulpit-signing-scripts
    - name: pulpit-tls
      persistentVolumeClaim:
        claimName: pulpit-tls
