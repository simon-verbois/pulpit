# nginx + pulpit-core + pulpit-worker merged into one container
# (docs/adr/0007-merged-pulpit-container.md) - mirrors compose.yml's
# `pulpit` service. The only pod meant to be reachable from outside this
# host (hostPort below); `pulp`/`redis` are reachable by pod name on the
# internal Podman network only. Its own
# database is embedded SQLite (the `pulpit-data` PVC below), not a
# separate Postgres pod - app/core/config/settings.py.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pulpit
  labels:
    app: pulpit
spec:
  # Waits for `pulp` to actually answer before starting the main
  # container - VERIFIED live `initContainers` run and block correctly
  # under `podman play kube`. Not strictly required (the worker loop's own
  # scheduled jobs simply fail-and-retry on their next poll if Pulp isn't
  # up yet - app/core/jobs), but avoids a burst of confusing "Connection
  # refused" log lines on every fresh deploy, matching compose.yml's own
  # `depends_on: pulp: condition: service_healthy`.
  initContainers:
    - name: wait-for-pulp
      image: docker.io/pulp/pulp:stable
      command:
        - sh
        - -c
        - |
          until curl -sf http://pulp:80/pulp/api/v3/status/ >/dev/null 2>&1; do
            echo "waiting for pulp..."
            sleep 5
          done
  containers:
    - name: pulpit
      # __PULPIT_IMAGE_TAG__ is substituted by ./deploy.sh at apply time
      # (defaults to "latest", same PULPIT_IMAGE_TAG convention as
      # compose.yml/.env.example - see README.md "Pinning versions and
      # overriding config") -
      # edit this directly to a real tag instead if you apply this file
      # without deploy.sh.
      image: docker.io/simonverbois/pulpit:__PULPIT_IMAGE_TAG__
      # allowPrivilegeEscalation/capabilities: deployment/docker/pulpit/
      # entrypoint.sh runs as root initially to chown/chmod /var/lib/pulpit
      # and the shared signing volumes, then drops to unprivileged users via
      # `su`/`setpriv` for the three actual processes (nginx, uvicorn,
      # worker) - see that file for the full reasoning. Deliberately NOT
      # `runAsNonRoot: true` - that would stop the container from ever
      # reaching that root-then-drop startup code at all. Capped to just the
      # capabilities that dance plausibly needs: CHOWN/DAC_OVERRIDE for the
      # chown/chmod calls, SETUID/SETGID for su/setpriv themselves.
      # Unverified against a real running container in this sandbox (no
      # live podman host available here) - if the entrypoint fails after
      # this change, check its logs for a denied syscall and add the
      # specific missing capability back rather than reverting to no
      # securityContext at all.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
      envFrom:
        - configMapRef:
            name: pulpit-config
      env:
        - name: PULPIT_CORE_PULP_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pulpit-secrets
              key: PULP_ADMIN_PASSWORD
        - name: PULPIT_CORE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pulpit-secrets
              key: PULPIT_CORE_SECRET_KEY
      ports:
        - containerPort: 8080
          hostPort: 8080
      volumeMounts:
        - name: pulpit-data
          mountPath: /var/lib/pulpit
        - name: pulpit-signing-gnupghome
          mountPath: /var/lib/pulpit-signing/gnupg
        - name: pulpit-signing-scripts
          mountPath: /var/lib/pulpit-signing/scripts
      # Conservative self-hosted defaults - this is a single-instance,
      # single-host deployment (see CLAUDE.md "Stay 100% local"), not a
      # multi-tenant cluster, so these just guard against one runaway
      # container starving the others on the same box. Adjust to your own
      # hardware/workload.
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
      # Through nginx, not pulpit-core's own port directly - VERIFIED this
      # exercises the whole proxy chain (nginx -> pulpit-core), not just
      # one of the two.
      readinessProbe:
        httpGet:
          path: /pulpit-core/api/v1/health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5
      livenessProbe:
        httpGet:
          path: /pulpit-core/api/v1/health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5
  volumes:
    - name: pulpit-data
      persistentVolumeClaim:
        claimName: pulpit-data
    # Declared in pulp.yaml - the same named Podman volume, shared between
    # the two pods (docs/signing.md "Shared volume permissions"). Apply
    # pulp.yaml first (./deploy.sh does) so these already exist.
    - name: pulpit-signing-gnupghome
      persistentVolumeClaim:
        claimName: pulpit-signing-gnupghome
    - name: pulpit-signing-scripts
      persistentVolumeClaim:
        claimName: pulpit-signing-scripts
