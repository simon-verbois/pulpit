# Mirrors compose.yml's redis service - optional for pulpcore (only used
# for HTTP response caching, not task queuing - see that file's own
# comment), no persistence needed or configured, internal only. Plain Pod,
# not a Deployment - a single instance is all this needs (same as every
# other component here), and VERIFIED live no Service object is needed for
# other pods to reach it by name (`redis`) - Podman's own DNS already
# registers every pod's name.
apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    app: redis
spec:
  containers:
    - name: redis
      image: docker.io/library/redis:8-alpine
      args: ["redis-server", "--save", "", "--appendonly", "no"]
      readinessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 10
        timeoutSeconds: 3
