# Mirrors compose.yml's redis service. Plain Pod, not a Deployment - Podman's
# own DNS already resolves it by name for other pods, no Service needed.
apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    app: redis
spec:
  containers:
    - name: redis
      image: docker.io/library/redis:8-alpine
      args: ["redis-server", "--save", "", "--appendonly", "no"]
      readinessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["redis-cli", "ping"]
        periodSeconds: 10
        timeoutSeconds: 3
