# Scoped Podman API access so `pulpit`'s worker loop can automatically
# finish the one manual Pulp step (registering a signing service -
# docs/signing.md "Automating the manual Pulp step") instead of always
# requiring an administrator to run a printed command - same mechanism and
# same image as compose.yml's docker-socket-proxy service, just expressed
# as a Pod instead of a Compose service. Deliberately NOT giving `pulpit`
# itself direct socket access: this proxy only forwards CONTAINERS+EXEC
# (list/inspect/exec), refusing every other Podman/Docker API call - a real
# reduction from "can control every container this user owns" to "can list
# containers and exec into one identified by a label", not a cosmetic one.
#
# `securityContext.seLinuxOptions.type: spc_t` is the Kube-YAML spelling of
# `podman run --security-opt label=disable` - VERIFIED live this (and only
# this) is what's needed to let a confined container connect to Podman's
# own API socket at all: it carries the SELinux type `container_runtime_t`,
# and default policy denies a normal confined container (`container_t`)
# from connecting to it (`ausearch -m avc` showed `denied { connectto }` -
# deliberate anti-escape confinement, not a bug). Only a no-op on hosts
# without SELinux enforcing (Ubuntu/Debian-family Podman hosts).
#
# __PULPIT_PODMAN_SOCKET_PATH__ below is substituted by ./deploy.sh at
# apply time (YAML has no built-in variable interpolation) - defaults to
# the current user's own rootless socket. Edit it directly instead if you
# apply this file without deploy.sh (e.g. a rootful Podman host uses the
# fixed /run/podman/podman.sock instead).
apiVersion: v1
kind: Pod
metadata:
  name: docker-socket-proxy
  labels:
    app: docker-socket-proxy
spec:
  containers:
    - name: docker-socket-proxy
      image: docker.io/tecnativa/docker-socket-proxy:latest
      securityContext:
        seLinuxOptions:
          type: spc_t
      env:
        - name: CONTAINERS
          value: "1"
        - name: EXEC
          value: "1"
        - name: POST
          value: "1"
      volumeMounts:
        - name: podman-socket
          mountPath: /var/run/docker.sock
  volumes:
    - name: podman-socket
      hostPath:
        path: __PULPIT_PODMAN_SOCKET_PATH__
        type: Socket
