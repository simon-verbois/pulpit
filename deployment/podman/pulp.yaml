# Mirrors compose.yml's `pulp` service. Single instance, same image.
#
# No postStart-hook equivalent under `podman play kube` - ./deploy.sh runs
# the script baked into the ConfigMap below via `podman exec` instead, once
# this pod is healthy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulp-init-admin-password-script
data:
  # Verbatim copy of ../docker/pulp/init-admin-password.sh - keep in sync by
  # hand. ConfigMap-backed rather than a hostPath bind-mount to avoid an
  # SELinux label mismatch a confined container can't read.
  init-admin-password.sh: |
    #!/bin/sh
    set -eu

    if [ -z "${PULP_ADMIN_PASSWORD:-}" ]; then
      echo "pulpit-init-admin-password: PULP_ADMIN_PASSWORD not set, leaving the admin account untouched."
      exit 0
    fi

    echo "pulpit-init-admin-password: PULP_ADMIN_PASSWORD is set, waiting for Pulp to finish initializing..."

    attempt=0
    max_attempts=30
    until pulpcore-manager reset-admin-password --password "$PULP_ADMIN_PASSWORD" >/tmp/pulpit-init-admin-password.log 2>&1; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge "$max_attempts" ]; then
        echo "pulpit-init-admin-password: giving up after $max_attempts attempts. Last output:" >&2
        cat /tmp/pulpit-init-admin-password.log >&2
        echo "pulpit-init-admin-password: you can retry manually with 'make pulp-reset-admin'." >&2
        exit 1
      fi
      sleep 5
    done

    echo "pulpit-init-admin-password: admin password set from PULP_ADMIN_PASSWORD."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-etc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-var-lib-pulp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-var-lib-pgsql
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-var-lib-containers
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# Shared with pulpit.yaml. Plain Podman named volumes under the hood -
# ReadWriteOnce is enough on a single host.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-signing-gnupghome
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulpit-signing-scripts
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pulp
  labels:
    app: pulp
spec:
  containers:
    - name: pulp
      image: docker.io/simonverbois/pulp-pulpit:latest
      envFrom:
        - configMapRef:
            name: pulpit-config
      env:
        - name: PULP_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pulpit-secrets
              key: PULP_SECRET_KEY
        - name: PULP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pulpit-secrets
              key: PULP_ADMIN_PASSWORD
      ports:
        # Dev-only convenience port, bound to loopback only. Remove if not
        # needed.
        - containerPort: 80
          hostPort: 8180
          hostIP: 127.0.0.1
      volumeMounts:
        - name: pulp-etc
          mountPath: /etc/pulp
        - name: pulp-var-lib-pulp
          mountPath: /var/lib/pulp
        - name: pulp-var-lib-pgsql
          mountPath: /var/lib/pgsql
        - name: pulp-var-lib-containers
          mountPath: /var/lib/containers
        - name: init-admin-password-script
          mountPath: /usr/local/bin/pulpit-init-admin-password.sh
          subPath: init-admin-password.sh
          readOnly: true
        - name: pulpit-signing-gnupghome
          mountPath: /var/lib/pulpit-signing/gnupg
        - name: pulpit-signing-scripts
          mountPath: /var/lib/pulpit-signing/scripts
          readOnly: true
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      readinessProbe:
        httpGet:
          path: /pulp/api/v3/status/
          port: 80
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 10
      livenessProbe:
        httpGet:
          path: /pulp/api/v3/status/
          port: 80
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 10
  volumes:
    - name: pulp-etc
      persistentVolumeClaim:
        claimName: pulp-etc
    - name: pulp-var-lib-pulp
      persistentVolumeClaim:
        claimName: pulp-var-lib-pulp
    - name: pulp-var-lib-pgsql
      persistentVolumeClaim:
        claimName: pulp-var-lib-pgsql
    - name: pulp-var-lib-containers
      persistentVolumeClaim:
        claimName: pulp-var-lib-containers
    - name: init-admin-password-script
      configMap:
        name: pulp-init-admin-password-script
        defaultMode: 0755
    - name: pulpit-signing-gnupghome
      persistentVolumeClaim:
        claimName: pulpit-signing-gnupghome
    - name: pulpit-signing-scripts
      persistentVolumeClaim:
        claimName: pulpit-signing-scripts
