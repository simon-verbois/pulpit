# Non-secret configuration, mirroring compose.yml's `environment:` values.
# Split from 00-secret.example.yaml so this file can be applied/diffed
# freely (no real credentials in it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulpit-config
data:
  PULP_UPSTREAM: "pulp:80"
  PULPIT_CORE_PULP_BASE_URL: "http://pulp:80"
  PULPIT_CORE_PULP_SERVICE_USERNAME: "admin"

  # Edit this yourself before running `deploy.sh up` - NOT substituted by
  # deploy.sh (defaults to "http://localhost:8080" below only because
  # that's this repo's own out-of-the-box value). Get it wrong and logins
  # will work but every subsequent action (including logout) 403s - see
  # docs/DEPLOYMENT.md "CSRF_TRUSTED_ORIGINS". Must match wherever
  # pulpit.yaml actually exposes the app publicly (a different hostPort, a
  # different hostname, a reverse proxy in front, etc.) - keep every line
  # below in sync, they all need the same value.
  PULPIT_PUBLIC_ORIGIN: "http://localhost:8080"
  PULP_CSRF_TRUSTED_ORIGINS: '["http://localhost:8080"]'
  PULP_CONTENT_ORIGIN: "http://localhost:8080"
  PULP_ANSIBLE_API_HOSTNAME: "http://localhost:8080"
  PULP_PYPI_API_HOSTNAME: "http://localhost:8080"

  PULP_CACHE_ENABLED: "true"
  PULP_REDIS_HOST: "redis"
  PULP_REDIS_PORT: "6379"
  # See docs/DEPLOYMENT.md "Container registry authentication". Do not
  # carry this into a production deployment.
  PULP_TOKEN_AUTH_DISABLED: "true"
