[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulpit-core"
version = "0.1.0"
description = "Pulpit's extensible backend component: generic job/event infrastructure plus feature modules (signing, and future automation modules)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<1.15",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<0.28",
  # Encrypts secrets pulpit-core itself must store at rest (currently just
  # the default-settings proxy password, app/core/crypto.py) - Fernet only,
  # not a general crypto toolkit dependency.
  "cryptography>=43,<44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "respx>=0.21,<0.22",
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501 (line-too-long) is ignored for now: the codebase already carries many
# long, deliberately-detailed inline comments/docstrings (see e.g.
# app/modules/signing/jobs.py) documenting VERIFIED-live Pulp API behavior -
# rewrapping dozens of pre-existing comment blocks is unrelated churn, not a
# real code-quality signal. Revisit (e.g. per-file-ignores, or wrapping the
# worst offenders) as a follow-up rather than a blocker for having the rest
# of the gate (E/F/I/B/UP) in place.
ignore = ["E501"]

# FastAPI's own dependency-injection idiom is `param: T = Depends(...)` - the
# call is deliberately evaluated once at route-registration time, not per
# request (B008 exists to catch accidental mutable-default bugs, which this
# isn't), so it's the one call bugbear should treat as an intentional
# "immutable" default rather than flagging as function-call-in-default-argument.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
# warn_return_any is off for now: app/adapters/pulp/client.py's methods all
# return the raw `.json()` of a Pulp response (Any) by design - there's no
# typed Pulp response model yet (see docs/PULP_API.md's "VERIFIED live"
# comments, which document shapes informally instead), so enabling this
# would surface ~20 pre-existing "Any" returns there that all need the same
# unrelated fix (typed response models) rather than a quick annotation.
# Revisit once/if Pulp responses get typed models.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
